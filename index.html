<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>우리집 미션 보드</title>
<meta name="theme-color" content="#60a5fa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="미션 보드">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#60a5fa;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    transition:opacity .5s;z-index:2}
  #splash img{width:110px;height:110px;border-radius:26px;box-shadow:0 16px 40px -14px rgba(0,0,0,.5);animation:pop .7s cubic-bezier(.22,1,.36,1)}
  #splash b{font-size:20px;letter-spacing:.5px}
  #splash small{opacity:.85;font-size:13px}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <b>🏠 우리집 미션 보드</b>
  <div class="dots"><span></span><span></span><span></span></div>
  <small>불러오는 중…</small>
</div>
<!-- ▼ 아래 src 를 Apps Script 웹앱 배포 URL(/exec 로 끝나는 주소)로 바꾸세요 -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxI8mIjwX8X1VGMPOK3XxnCQCs6qqA2WGn8UX9978hl4p2OGt3ogKOE-pDzfLCMXwct/exec" allow="clipboard-write"></iframe>
<script>
  var f = document.getElementById('app'), s = document.getElementById('splash');
  function hide(){ s.style.opacity = 0; setTimeout(function(){ s.remove(); }, 500); }
  f.addEventListener('load', function(){ setTimeout(hide, 600); });
  setTimeout(hide, 6000); // 안전장치
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
